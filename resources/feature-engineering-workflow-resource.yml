common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    write_feature_table_job:
      name: ${bundle.target}-my_mlops_project-write-feature-table-job
      tasks:
        - task_key: PopulationFeatures
          environment_key: default
          notebook_task:
            notebook_path: ../feature_engineering/GenerateAndWriteFeatures.py
            base_parameters:
              input_table_path: ${var.catalog_name}.my_mlops_project.population
              input_start_date: ""
              input_end_date: ""
              timestamp_column: ""
              output_table_name: ${var.catalog_name}.my_mlops_project.population_features
              features_transform_module: population_features
              primary_keys: year
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - -r ../requirements.txt
      schedule:
        quartz_cron_expression: "0 0 7 * * ?" # daily at 7am
        timezone_id: UTC
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
